<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>トップ画面</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <h1>書籍一覧</h1>
    <a>
        <strong>検索</strong>
    </a>
    <form th:action="@{/books}" th:object="${bookForm}" method="get">
        <div>
            <label for="title">タイトル：</label>
            <input type="text" name="title" id="title">
        </div>
        <div>
            <button type="submit">検索</button>
            <button type="button" onclick="location.href='/books/top'">クリア</button>
        </div>
    </form>

    <table border="1" `>
        <p th:text="|${currentPage}/${totalPages}ページ|">1/2</p>
        <thead>
            <tr>
                <th>書籍名</th>
                <th>価格</th>
                <th>カテゴリ</th>
                <th>在庫数</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.title}"></td>
                <td th:text="${book.price}"></td>
                <td>
                    <span th:text="${book.category}"></span>
                </td>
                <td th:text="${book.stock}"></td>
                <td>
                    <form th:if="${role == '会員'}" th:action="@{/books/purchase/{id}(id=${book.id})}">
                        <button th:if="${book.stock > 0}">購入する</button>
                    </form>
                    <form th:if="${role == '在庫管理者'|| role == 'システム管理者'}" th:action="@{/books/edit/{id}(id=${book.id})}">
                        <button type="submit">編集</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <p th:if="${books.size() == 0}">該当する本は見つかりませんでした。</p>
    <button type="button" th:onclick="|location.href='@{/menu}'|">戻る</button>

    <div class="mt-4" th:if="${totalPages > 0}">
        <nav aria.label="Page navigation example">
            <ul class="pagination">
                <li th:classppend="${currentPage ==1 } ? 'disabled'" class="page-item">
                    <a class="page-link" th:href="@{/books/top(page=${currentPage - 1})}" th:if="${currentPage > 1}"
                        aria-label="Previous">
                        <span th:if="${currentPage > 1}" aria-hidden="true">&laquo;</span>
                        <span class="sr-only">Previous</span>
                    </a>
                </li>
                <li th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${pageNum == currentPage} ? 'active'" class="page-item">
                    <a class="page-link" th:href="@{/books/top(page=${pageNum})}" th:text="${pageNum}"></a>
                </li>
                <li th:classppend="${currentPage == totalPages} ? 'disabled'" class="page-item">
                    <a class="page-link" th:href="@{/books/top(page=${currentPage + 1})}"
                        th:if="${currentPage < totalPages}" aria-label="Next">
                        <span th:if="${currentPage >= totalPages}" aria-hidden="true">&raquo;</span>
                        <span class="sr-only">Next</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</body>

</html>
