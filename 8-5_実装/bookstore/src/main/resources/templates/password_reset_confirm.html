<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>本人確認</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <h1>本人確認</h1>
    <p th:if="${message}" th:text="${message}" style="color: red;"></p>
    <form th:action="@{/password_reset_confirm}" method="post">
        <label for="role">登録時の役職</label>
        <select id="role" name="role">
            <option value="一般">一般</option>
            <option value="在庫管理者">在庫管理者</option>
            <option value="システム管理者">システム管理者</option>
        </select>
        <br>
        <button type="submit">確認</button>
    </form>
    <a href="/password_reset">戻る</a>
</body>
</html>
