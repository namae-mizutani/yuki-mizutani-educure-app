<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>売上集計</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <form th:action="@{/tally}" th:object="${salesForm}" method="post">
        <h1>売上集計</h1>

        <p>期間</p>
        <input type="date" th:field="*{startDate}"> 〜 <input type="date" th:field="*{endDate}">
        <button type="submit">検索</button>
        <p th:if="${message}" th:text="${message}" style="color: red;"></p>

        <p>書籍名 / 売れた数 / 売上金額</p>
        <div th:each="book : ${salesList}">
            <span th:text="${book.title}">書籍名</span> /
            <span th:text="${book.salesAmount}">0</span>冊 /
            <span th:text="${book.totalSales}">0</span>円
        </div>
    </form>

    <div>
        <button type="submit" th:formaction="@{/books/csvdownload}">CSV出力</button>
        <br>
        <br>

        <form th:action="@{/books/total}" method="post" enctype="multipart/form-data">
            <p>書籍名は「書籍管理」画面に登録済みの名称と一致させてください。</p>
            <p>書式例: 書籍名, 数量, 金額, 日付(yyyy/mm/dd)</p>

            <input type="file" name="file" accept=".csv" required>
            <button type="submit">CSVアップロード</button>
            <p th:if="${msg}" th:text="${msg}" style="color: red;"></p>
        </form>
        <a th:href="@{/menu}"><button type="button">戻る</button></a>
    </div>
</body>

</html>
